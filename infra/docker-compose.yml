name: cocinavecina

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    mem_limit: 768m
    restart: always

  api:
    profiles: ["full"]
    build: ../backend
    image: cocinavecina-api:local
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      TASKS_ENABLED: "false"
      PHOTOS_DIR: /data/photos
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: always

  worker:
    profiles: ["full"]
    build: ../backend
    image: cocinavecina-api:local
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      PHOTOS_DIR: /data/photos
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    restart: always

  photos:
    profiles: ["full"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - photos:/usr/share/nginx/html/photos:ro
      - ./nginx/photos.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    restart: always

volumes:
  db_data:
  photos:

